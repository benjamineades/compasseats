name: Ingest — undo

# Reverses one promoted batch, in one transaction.
#
# It will not run unless the confirmation field reads exactly
#   UNDO <batch key>
# and it refuses outright if anything the batch created has been changed or
# leant on since it promoted.
#
# `dry_run` starts TICKED. A dry run is the first thing you do, every time: it
# reads the whole plan, prints what would go with every count and its
# population, and rolls back. Untick it only once you have read that output.
#
# Actions tab -> "Ingest — undo" -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      batch_key:
        description: "Batch key — the one from the promote report"
        required: true
        type: string
      confirmation:
        description: "Type: UNDO <batch key>"
        required: true
        type: string
      dry_run:
        description: "Dry run — work out the whole undo, print it, then roll it back (do this first)"
        required: false
        default: true
        type: boolean

# Shares the promote job's concurrency group, keyed on the batch: an undo and a
# promote of the same batch can never run at once.
concurrency:
  group: ingest-${{ inputs.batch_key }}
  cancel-in-progress: false

jobs:
  undo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Every input goes through env, never spliced into the shell. Splicing
      # would let a crafted batch_key smuggle a second --confirm past the
      # typed-confirmation gate, which is the one gate that must not be
      # bypassable.
      - name: Undo the batch
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BATCH_KEY: ${{ inputs.batch_key }}
          CONFIRMATION: ${{ inputs.confirmation }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=(--batch-key "$BATCH_KEY" --confirm "$CONFIRMATION")
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          bun run scripts/ingest/undo.ts "${ARGS[@]}" | tee /tmp/undo.out

      - name: Put the report in the run summary
        if: always()
        run: |
          if [ -f /tmp/undo.out ]; then
            cat /tmp/undo.out >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing was undone. See the log above for why." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-undo-${{ inputs.batch_key }}
          path: reports/
          if-no-files-found: ignore

      - name: Commit the report to the repo
        if: always()
        env:
          BATCH_KEY: ${{ inputs.batch_key }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain reports/)" ]; then
            echo "No report changes to commit."
            exit 0
          fi
          git config user.name  "compasseats-ingest"
          git config user.email "ingest@users.noreply.github.com"
          git add reports/
          git commit -m "ingest: undo report for $BATCH_KEY"
          git push
