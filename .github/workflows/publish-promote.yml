name: Publish — promote

# Points the preview (channels/preview.json on the publish-preview branch) at
# one version. Before it moves the pointer it checks that version's folder
# against its own manifest, file by file.
#
# It will not run unless the confirmation field reads exactly
#   PUBLISH <version>
#
# It never writes to the database and never touches the live site.
#
# Actions tab -> "Publish — promote" -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version id, from the build report (looks like 20261107T020000Z)"
        required: true
        type: string
      confirmation:
        description: "Type: PUBLISH <version>"
        required: true
        type: string
      dry_run:
        description: "Dry run — do every check, print what would change, change nothing"
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-preview
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check out the publish-preview branch
        run: bash scripts/publish/checkout-preview.sh "$RUNNER_TEMP/preview" require

      # Every input goes through env, never spliced into the shell. Splicing
      # would let a crafted version smuggle a second --confirm past the
      # typed-confirmation gate.
      - name: Promote the version
        env:
          VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=(--tree "$RUNNER_TEMP/preview" --version "$VERSION" --confirm "$CONFIRMATION" --run "$GITHUB_RUN_ID")
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          bun run scripts/publish/promote.ts "${ARGS[@]}" | tee "$RUNNER_TEMP/promote.out"

      - name: Put the result in the run summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/promote.out" ]; then
            cat "$RUNNER_TEMP/promote.out" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing was promoted. See the log above for why." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push the pointer change
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/preview"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No change to push."
            exit 0
          fi
          git config user.name  "compasseats-publish"
          git config user.email "publish@users.noreply.github.com"
          git add -A
          git commit -q -m "publish: promote $VERSION to preview"
          git push origin HEAD:refs/heads/publish-preview
